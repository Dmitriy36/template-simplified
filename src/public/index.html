<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Report Template</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="container">

      <div id="map-container">
        <div id="controls-container">

          <div class="controls-row">
            <button id="clearallBtn"  onclick="ClearAll()">Clear All</button>
            <button id="loadallBtn"   onclick="AddLinesAll()">Load All</button>
            <button id="loadselectedBtn" onclick="AddLinesSelected()">Load Selected</button>
            <button id="reportBtn"    onclick="RunReport()">Run Report</button>
            <button onclick="window.open('flowchart.html', '_blank')">System Flowchart</button>
          </div>

        </div>

        <div id="main-map">
          <div id="alaska-inset">
            <div class="inset-label">Alaska</div>
          </div>
          <div id="hawaii-inset">
            <div class="inset-label">Hawaii</div>
          </div>
        </div>
      </div>

      <div id="sidebar"></div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
